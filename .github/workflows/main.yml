name: Build RDORO Windows Installer

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare Clean Config & Folder Structure
        shell: pwsh
        run: |
          $utf8 = New-Object System.Text.UTF8Encoding($false)

          # 1. Pure geometric SVG icon
          $svg = @'
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
            <rect width="512" height="512" rx="115" fill="#08130E"/>
            <circle cx="256" cy="256" r="190" fill="none" stroke="#6DD3A1" stroke-width="44"/>
            <circle cx="256" cy="256" r="68" fill="#6DD3A1"/>
          </svg>
          '@
          [System.IO.File]::WriteAllText("$PWD/app-icon.svg", $svg, $utf8)

          # 2. Clean package.json without @preact/preset-vite peer conflict
          $pkg = @'
          {
            "name": "rdoro",
            "private": true,
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "vite build",
              "tauri": "tauri"
            },
            "dependencies": {
              "@tauri-apps/api": "^2.1.0",
              "@tauri-apps/plugin-autostart": "^2.0.1",
              "@tauri-apps/plugin-global-shortcut": "^2.0.1",
              "@tauri-apps/plugin-notification": "^2.0.1",
              "@tauri-apps/plugin-window-state": "^2.0.1",
              "preact": "^10.24.3"
            },
            "devDependencies": {
              "@tauri-apps/cli": "^2.1.0",
              "typescript": "^5.6.3",
              "vite": "^5.4.10"
            }
          }
          '@
          [System.IO.File]::WriteAllText("$PWD/package.json", $pkg, $utf8)

          # 3. Native esbuild Preact JSX in vite.config.ts (zero external plugin needed)
          $vite = @'
          import { defineConfig } from "vite";

          export default defineConfig({
            esbuild: {
              jsx: "automatic",
              jsxImportSource: "preact"
            },
            clearScreen: false,
            build: {
              target: "esnext",
              minify: "esbuild",
              sourcemap: false
            }
          });
          '@
          [System.IO.File]::WriteAllText("$PWD/vite.config.ts", $vite, $utf8)

          # 4. Ensure subfolder layout
          New-Item -ItemType Directory -Force -Path "src/components" | Out-Null
          New-Item -ItemType Directory -Force -Path "src-tauri/src" | Out-Null
          New-Item -ItemType Directory -Force -Path "src-tauri/capabilities" | Out-Null

          foreach ($f in @("TitleBar.tsx","Header.tsx","ModeTabs.tsx","Ring.tsx","Controls.tsx","MiniMode.tsx","Stats.tsx","Settings.tsx")) {
            if ((Test-Path "src/$f") -and !(Test-Path "src/components/$f")) { Move-Item "src/$f" "src/components/$f" }
            if ((Test-Path $f) -and !(Test-Path "src/components/$f")) { Move-Item $f "src/components/$f" }
          }
          foreach ($f in @("main.rs","lib.rs","database.rs","tray.rs","notifications.rs","shortcuts.rs")) {
            if ((Test-Path "src-tauri/$f") -and !(Test-Path "src-tauri/src/$f")) { Move-Item "src-tauri/$f" "src-tauri/src/$f" }
            if ((Test-Path $f) -and !(Test-Path "src-tauri/src/$f")) { Move-Item $f "src-tauri/src/$f" }
          }
          if ((Test-Path "src-tauri/default.json") -and !(Test-Path "src-tauri/capabilities/default.json")) {
            Move-Item "src-tauri/default.json" "src-tauri/capabilities/default.json"
          }

      - name: Install Dependencies with pnpm
        run: pnpm install --no-frozen-lockfile

      - name: Generate App Icons
        run: pnpm tauri icon app-icon.svg

      - name: Build RDORO Installer
        run: pnpm tauri build

      - name: Upload Windows Installer (.exe and .msi)
        uses: actions/upload-artifact@v4
        with:
          name: RDORO-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
